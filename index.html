<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1–4 · 1200 Words Flashcards</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#171D22;
    --panel:#20282E;
    --panel-2:#273138;
    --line:#39464F;
    --text:#EFE9DE;
    --dim:#9AA5AD;
    --cinnabar:#C8472F;
    --cinnabar-soft:#E06A4F;
    --jade:#7FA992;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:20px 16px 28px;
  }
  /* ===== header ===== */
  header{width:100%;max-width:680px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:.04em;}
  .brand .seal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--cinnabar);color:var(--text);font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;flex:none;}
  .brand .sub{font-size:12px;color:var(--dim);}
  .toolbar{display:flex;gap:8px;}
  .toolbar button{
    appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
    padding:7px 14px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .toolbar button:hover{border-color:var(--cinnabar-soft);}
  .toolbar button.active{background:var(--cinnabar);border-color:var(--cinnabar);}

  /* ===== progress ===== */
  .progress-wrap{width:100%;max-width:680px;margin:16px 0 14px;}
  .progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px;}
  .progress-meta b{color:var(--text);font-weight:600;}
  .bar{height:4px;background:var(--panel-2);border-radius:99px;overflow:hidden;}
  .bar i{display:block;height:100%;width:1%;background:var(--cinnabar);border-radius:99px;transition:width .3s ease;}

  /* ===== card ===== */
  main{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;}
  .scene{width:100%;perspective:1200px;}
  .card3d{width:100%;height:min(420px,56vh);min-height:300px;cursor:pointer;}
  .card-inner{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.1,.2,1);
  }
  .card3d.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    border:1px solid var(--line);background:var(--panel);
  }
  .face .tag{position:absolute;top:16px;left:18px;font-size:11px;color:var(--dim);letter-spacing:.12em;}
  .face .corner{position:absolute;top:14px;right:16px;font-size:11px;color:var(--dim);}
  .face .hint{position:absolute;bottom:14px;font-size:11px;color:var(--dim);}
  .front .hanzi{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:clamp(64px,15vw,128px);line-height:1.15;color:var(--text);
    text-align:center;padding:0 20px;word-break:break-all;
  }
  .back{transform:rotateY(180deg);background:var(--panel-2);}
  .back .pinyin{
    font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(30px,7vw,46px);color:var(--cinnabar-soft);
  }
  .back .meaning{font-size:clamp(20px,4.6vw,28px);font-weight:500;color:var(--text);text-align:center;padding:0 24px;}
  .back .divider{width:56px;height:2px;background:var(--line);border-radius:99px;}

  /* ===== controls ===== */
  .controls{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center;}
  .controls button{
    appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
    padding:10px 22px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
  }
  .controls button:hover{border-color:var(--cinnabar-soft);}
  .controls button:active{transform:translateY(1px);}
  .controls button.primary{background:var(--cinnabar);border-color:var(--cinnabar);font-weight:600;}
  .controls button.primary:hover{background:var(--cinnabar-soft);border-color:var(--cinnabar-soft);}
  .controls button:disabled{opacity:.35;cursor:not-allowed;}

  .keys{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:18px;font-size:12px;color:var(--dim);}
  .keys kbd{
    font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:2px 7px;background:var(--panel);color:var(--text);
  }

  /* ===== list view ===== */
  .list-view{display:none;width:100%;max-width:680px;margin-top:10px;}
  body.show-list .list-view{display:block;}
  body.show-list .flash-view{display:none;}
  .table-wrap{max-height:calc(100vh - 260px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);}
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  colgroup col:first-child{width:9%;}
  colgroup col:nth-child(2){width:23%;}
  colgroup col:nth-child(3){width:28%;}
  colgroup col:nth-child(4){width:40%;}
  th,td{padding:10px 12px;text-align:left;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  thead th{
    position:sticky;top:0;background:var(--panel-2);color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.06em;
    border-bottom:1px solid var(--line);z-index:1;
  }
  tbody tr:nth-child(odd){background:rgba(255,255,255,.02);}
  tbody tr:hover{background:rgba(200,71,47,.08);}
  td.num{color:var(--dim);font-variant-numeric:tabular-nums;}
  td.hanzi{font-family:"Noto Serif SC",serif;font-weight:700;}
  td.pinyin{color:var(--cinnabar-soft);font-family:"Noto Sans SC",sans-serif;}
  td.en{color:var(--text);}

  @media (max-width:560px){
    body{padding:16px 12px 24px;}
    .brand h1{font-size:17px;}
    .card3d{height:52vh;min-height:280px;}
    .controls button{padding:9px 16px;font-size:13px;}
    .toolbar button{padding:6px 10px;font-size:12px;}
    th,td{font-size:13px;padding:8px 10px;}
  }

  @media (prefers-reduced-motion:reduce){
    .card-inner{transition:none;}
  }
</style>
</head>

<header>

    <span class="sub">shuffled deck</span>
  </div>

    <button id="listBtn" title="切换列表">List 列表</button>
  </div>
</header>

<div class="progress-wrap">

  </div>

</div>

<main>

            <span class="hint">click to flip · 点击翻面</span>
          </div>
          <div class="face back">

            <span class="pinyin" id="pinyin">àiqíng</span>
            <span class="divider"></span>
            <span class="meaning" id="meaning">Love</span>
            <span class="hint">click to flip back</span>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="prevBtn">← Prev 上一张</button>
      <button class="primary" id="flipBtn">Flip 翻面</button>
      <button id="nextBtn">Next 下一张 →</button>
    </div>
  </section>

  <section class="list-view" id="listView">
    <div class="table-wrap">
      <table>
        <colgroup>
          <col><col><col><col>
        </colgroup>
        <thead>
          <tr><th>No.</th><th>汉字</th><th>Pinyin</th><th>English</th></tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="keys">
  <span><kbd>←</kbd> / <kbd>→</kbd> navigate</span>
  <span><kbd>Space</kbd> flip</span>
  <span><kbd>S</kbd> shuffle</span>
  <span><kbd>L</kbd> list view</span>
</div>

  order = WORDS.map(function(_,i){return i;});

  document.getElementById('hanzi').textContent = w[1];
  document.getElementById('pinyin').textContent = w[2];
  document.getElementById('meaning').textContent = w[3];
  document.getElementById('frontNo').textContent = 'No.' + (cur + 1);
  document.getElementById('posLabel').textContent = 'Card ' + (cur + 1) + ' / ' + total;
  document.getElementById('progressBar').style.width = ((cur + 1) / total * 100) + '%';
  document.getElementById('card3d').classList.toggle('flipped', flipped);
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === total - 1;
}

function renderList(){
  const body = document.getElementById('listBody');
  let html = '';
  for(let i = 0; i < order.length; i++){
    const w = WORDS[order[i]];
    html += '<tr><td class="num">' + (i + 1) + '</td><td class="hanzi">' + w[1] + '</td><td class="pinyin">' + w[2] + '</td><td class="en">' + w[3] + '</td></tr>';
  }
  body.innerHTML = html;
}

function toggleList(){
  showList = !showList;
  document.body.classList.toggle('show-list', showList);
  document.getElementById('listBtn').classList.toggle('active', showList);
  document.getElementById('listBtn').textContent = showList ? 'Cards 卡片' : 'List 列表';
  if(showList) renderList();
}

function flip(){ flipped = !flipped; render(); }
function next(){ if(cur < total - 1){ cur++; flipped = false; render(); } }
function prev(){ if(cur > 0){ cur--; flipped = false; render(); } }

/* events */
document.getElementById('card3d').addEventListener('click', flip);
document.getElementById('flipBtn').addEventListener('click', flip);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('shuffleBtn').addEventListener('click', function(){
  shuffle(); render(); if(showList) renderList();
});
document.getElementById('listBtn').addEventListener('click', toggleList);

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight'){ next(); }
  else if(e.key === 'ArrowLeft'){ prev(); }
  else if(e.key === ' '){ e.preventDefault(); flip(); }
  else if(e.key === 's' || e.key === 'S'){ shuffle(); render(); if(showList) renderList(); }
  else if(e.key === 'l' || e.key === 'L'){ toggleList(); }
});

/* start shuffled */
shuffle();
render();
</script>
</body>
